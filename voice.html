<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Invoicer Voice Command</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            color: #333;
        }
        #wrap { text-align: center; padding: 24px; max-width: 320px; }
        #micDot {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            margin: 0 auto;
            background: #007aff;
            color: #fff;
            font-size: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
        }
        #micDot.listening {
            background: #ff3b30;
            animation: voice-pulse 1.2s ease-in-out infinite;
        }
        @keyframes voice-pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.45); }
            50% { box-shadow: 0 0 0 14px rgba(255, 59, 48, 0); }
        }
        #msg { margin-top: 16px; font-size: 14px; color: #666; min-height: 20px; }
        #msg.error { color: #c00; }
        #cancelLink {
            display: inline-block;
            margin-top: 14px;
            font-size: 13px;
            color: #999;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div id="wrap">
    <div id="micDot">🎤</div>
    <div id="msg">Starting microphone…</div>
    <div id="cancelLink">Cancel</div>
</div>
<script>
    // Standalone page, deliberately NOT served by Apps Script's HtmlService — same reason as
    // index.html in this repo (Google Picker 401): Apps Script's sandboxed content iframe also
    // withholds the "microphone" Permissions-Policy from its enclosing iframe, which the app
    // author has no way to grant, so getUserMedia() fails instantly with no browser prompt at
    // all when called from inside Invoicer's own page. This page runs as a genuine top-level
    // tab instead, where mic access works normally. It carries no secrets and persists nothing —
    // recording starts automatically on load, stops automatically once the speaker goes quiet
    // (simple RMS-based voice-activity detection, no server round trip needed for that part),
    // and the clip is handed to the opener over postMessage as soon as it stops. The whole flow
    // needs zero clicks in the normal case; "Cancel" is just an escape hatch.
    const SRC = 'invoicer-voice';
    const MIME_CANDIDATES = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus', 'audio/mp4'];

    // RMS (0..1) above this counts as "speaking". Ambient room noise typically sits well under
    // this; normal speaking voice clears it easily. SILENCE_MS is how long it has to stay below
    // that after speech was heard before we consider the sentence finished.
    const SPEECH_RMS_THRESHOLD = 0.04;
    const SILENCE_MS = 1600;
    const MIN_RECORDING_MS = 500;
    const MAX_RECORDING_MS = 25000;

    let mediaRecorder = null;
    let chunks = [];
    let alreadyPosted = false;
    let audioContext = null;
    let monitorRafId = null;
    let recordingStartedAt = 0;
    let hasHeardSpeech = false;
    let lastLoudAt = 0;

    function post(payload) {
        alreadyPosted = true;
        if (window.opener) window.opener.postMessage(Object.assign({source: SRC}, payload), '*');
    }

    function setMsg(text, isError) {
        const el = document.getElementById('msg');
        el.textContent = text;
        el.className = isError ? 'error' : '';
    }

    function blobToDataUrl(blob) {
        return new Promise(function (resolve, reject) {
            const reader = new FileReader();
            reader.onload = function () { resolve(reader.result); };
            reader.onerror = reject;
            reader.readAsDataURL(blob);
        });
    }

    function getRms_(analyser, buffer) {
        analyser.getByteTimeDomainData(buffer);
        let sumSquares = 0;
        for (let i = 0; i < buffer.length; i++) {
            const v = (buffer[i] - 128) / 128;
            sumSquares += v * v;
        }
        return Math.sqrt(sumSquares / buffer.length);
    }

    // Polls mic volume every animation frame. Auto-stops once the speaker has been heard AND
    // has since gone quiet for SILENCE_MS; MAX_RECORDING_MS is a hard cap in case VAD never
    // triggers (e.g. constant background noise keeps it "loud").
    function watchForSilence_(stream) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioContext.createMediaStreamSource(stream);
        const analyser = audioContext.createAnalyser();
        analyser.fftSize = 2048;
        source.connect(analyser); // analysis only — never connected to destination, so the
                                   // speaker never hears their own voice echoed back.
        const buffer = new Uint8Array(analyser.fftSize);

        recordingStartedAt = Date.now();
        lastLoudAt = recordingStartedAt;
        hasHeardSpeech = false;

        function tick() {
            const now = Date.now();
            const elapsed = now - recordingStartedAt;
            const rms = getRms_(analyser, buffer);

            if (rms > SPEECH_RMS_THRESHOLD) {
                hasHeardSpeech = true;
                lastLoudAt = now;
            }

            if (elapsed > MAX_RECORDING_MS) {
                stopRecording_();
                return;
            }
            if (hasHeardSpeech && elapsed > MIN_RECORDING_MS && (now - lastLoudAt) > SILENCE_MS) {
                stopRecording_();
                return;
            }

            monitorRafId = requestAnimationFrame(tick);
        }
        monitorRafId = requestAnimationFrame(tick);
    }

    async function startRecording_() {
        if (!navigator.mediaDevices || !window.MediaRecorder) {
            setMsg('This browser does not support voice recording.', true);
            return;
        }
        try {
            const stream = await navigator.mediaDevices.getUserMedia({audio: true});
            const supportedMimeType = MIME_CANDIDATES.find(t => window.MediaRecorder.isTypeSupported && window.MediaRecorder.isTypeSupported(t));
            mediaRecorder = supportedMimeType ? new MediaRecorder(stream, {mimeType: supportedMimeType}) : new MediaRecorder(stream);
            chunks = [];

            mediaRecorder.addEventListener('dataavailable', function (e) {
                if (e.data && e.data.size > 0) chunks.push(e.data);
            });
            mediaRecorder.addEventListener('stop', async function () {
                stream.getTracks().forEach(track => track.stop());
                if (audioContext) { audioContext.close(); audioContext = null; }

                if (!chunks.length) {
                    setMsg('No audio captured.', true);
                    return;
                }
                setMsg('Sending…');
                const blob = new Blob(chunks, {type: (mediaRecorder && mediaRecorder.mimeType) || 'audio/webm'});
                const dataUrl = await blobToDataUrl(blob);
                post({type: 'recorded', dataUrl: dataUrl, mimeType: blob.type});
                window.close();
            });

            mediaRecorder.start();
            document.getElementById('micDot').classList.add('listening');
            setMsg('Listening… speak your invoice, then go quiet.');
            watchForSilence_(stream);
        } catch (err) {
            setMsg('Microphone access was denied.', true);
        }
    }

    function stopRecording_() {
        if (monitorRafId) { cancelAnimationFrame(monitorRafId); monitorRafId = null; }
        document.getElementById('micDot').classList.remove('listening');
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
            mediaRecorder.stop();
        }
    }

    document.getElementById('cancelLink').addEventListener('click', function () {
        stopRecording_();
        window.close();
    });

    // Fallback "cancel" signal for every way this tab can go away without a recording having
    // been sent yet — the opener also polls window.closed as a belt-and-suspenders backup in
    // case beforeunload doesn't fire.
    window.addEventListener('beforeunload', function () {
        if (!alreadyPosted) post({type: 'cancel'});
    });

    if (!window.opener) {
        setMsg('This page must be opened from Invoicer.', true);
    } else {
        startRecording_();
    }
</script>
</body>
</html>
