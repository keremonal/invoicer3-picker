<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Invoicer Voice Command</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            color: #333;
        }
        #wrap { text-align: center; padding: 24px; max-width: 320px; }
        #micBtn {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            border: none;
            background: #007aff;
            color: #fff;
            font-size: 36px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
        }
        #micBtn.recording {
            background: #ff3b30;
            animation: voice-pulse 1.2s ease-in-out infinite;
        }
        #micBtn:disabled { opacity: 0.4; cursor: default; }
        @keyframes voice-pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.45); }
            50% { box-shadow: 0 0 0 14px rgba(255, 59, 48, 0); }
        }
        #msg { margin-top: 16px; font-size: 14px; color: #666; min-height: 20px; }
        #msg.error { color: #c00; }
    </style>
</head>
<body>
<div id="wrap">
    <button type="button" id="micBtn">🎤</button>
    <div id="msg">Tap to start recording</div>
</div>
<script>
    // Standalone page, deliberately NOT served by Apps Script's HtmlService — same reason as
    // index.html in this repo (Google Picker 401): Apps Script's sandboxed content iframe also
    // withholds the "microphone" Permissions-Policy from its enclosing iframe, which the app
    // author has no way to grant, so getUserMedia() fails instantly with no browser prompt at
    // all when called from inside Invoicer's own page. This page runs as a genuine top-level
    // tab instead, where mic access works normally. It carries no secrets and persists nothing —
    // the recorded clip is handed to the opener over postMessage as soon as recording stops,
    // then this tab closes itself.
    const SRC = 'invoicer-voice';
    let mediaRecorder = null;
    let chunks = [];
    let isRecording = false;
    let alreadyPosted = false;

    const MIME_CANDIDATES = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus', 'audio/mp4'];

    function post(payload) {
        alreadyPosted = true;
        if (window.opener) window.opener.postMessage(Object.assign({source: SRC}, payload), '*');
    }

    function setMsg(text, isError) {
        const el = document.getElementById('msg');
        el.textContent = text;
        el.className = isError ? 'error' : '';
    }

    function blobToDataUrl(blob) {
        return new Promise(function (resolve, reject) {
            const reader = new FileReader();
            reader.onload = function () { resolve(reader.result); };
            reader.onerror = reject;
            reader.readAsDataURL(blob);
        });
    }

    async function startRecording() {
        if (!navigator.mediaDevices || !window.MediaRecorder) {
            setMsg('This browser does not support voice recording.', true);
            return;
        }
        try {
            const stream = await navigator.mediaDevices.getUserMedia({audio: true});
            const supportedMimeType = MIME_CANDIDATES.find(t => window.MediaRecorder.isTypeSupported && window.MediaRecorder.isTypeSupported(t));
            mediaRecorder = supportedMimeType ? new MediaRecorder(stream, {mimeType: supportedMimeType}) : new MediaRecorder(stream);
            chunks = [];

            mediaRecorder.addEventListener('dataavailable', function (e) {
                if (e.data && e.data.size > 0) chunks.push(e.data);
            });
            mediaRecorder.addEventListener('stop', async function () {
                stream.getTracks().forEach(track => track.stop());
                if (!chunks.length) {
                    isRecording = false;
                    document.getElementById('micBtn').classList.remove('recording');
                    document.getElementById('micBtn').textContent = '🎤';
                    setMsg('No audio captured. Tap to try again.', true);
                    return;
                }
                setMsg('Sending…');
                const blob = new Blob(chunks, {type: (mediaRecorder && mediaRecorder.mimeType) || 'audio/webm'});
                const dataUrl = await blobToDataUrl(blob);
                post({type: 'recorded', dataUrl: dataUrl, mimeType: blob.type});
                window.close();
            });

            mediaRecorder.start();
            isRecording = true;
            document.getElementById('micBtn').classList.add('recording');
            document.getElementById('micBtn').textContent = '⏹';
            setMsg('Listening… tap to stop');
        } catch (err) {
            setMsg('Microphone access was denied.', true);
        }
    }

    function stopRecording() {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
            mediaRecorder.stop();
        }
    }

    document.getElementById('micBtn').addEventListener('click', function () {
        if (isRecording) {
            stopRecording();
        } else {
            startRecording();
        }
    });

    // Fallback "cancel" signal for every way this tab can go away without a recording having
    // been sent yet (user closes it, navigates away, etc.) — the opener also polls window.closed
    // as a belt-and-suspenders backup in case beforeunload doesn't fire.
    window.addEventListener('beforeunload', function () {
        if (!alreadyPosted) post({type: 'cancel'});
    });

    if (!window.opener) {
        setMsg('This page must be opened from Invoicer.', true);
        document.getElementById('micBtn').disabled = true;
    }
</script>
</body>
</html>
